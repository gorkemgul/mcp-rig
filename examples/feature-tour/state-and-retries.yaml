# A tool can commit its side effect and then lose its response. These cases
# arm that failure, retry the identical call, and check server state with
# `verify` instead of trusting the retry's response alone.
server: python ../../tests/fixtures/ledger_server.py

setup:
  - call: reset_records

teardown:
  - call: reset_records

tests:
  - name: arms a lost response for the unprotected tool
    call: arm_lost_response
    args: {mode: disconnect}

  - name: unprotected retry creates a duplicate
    call: create_record
    args: {name: invoice}
    retry:
      attempts: 1
    expect:
      json_path: {name: invoice}
    verify:
      - call: count_records
        args: {name: invoice}
        expect:
          json_path: {records: 2, invocations: 2}

  - name: arms a lost response for the idempotent tool
    call: arm_lost_response
    args: {mode: hang}

  - name: idempotent retry applies once
    call: create_record_idempotent
    args: {name: receipt, idempotency_key: receipt-001}
    timeout_s: 0.5
    retry:
      attempts: 1
    expect:
      json_path: {name: receipt}
    verify:
      - call: count_records
        args: {name: receipt}
        expect:
          json_path: {records: 1, invocations: 2}
