# A tool can commit its side effect and then lose its response. `fault` makes
# MCP Rig lose the response on purpose; the server itself is not modified.
# `retry` repeats the identical call, and `verify` checks the server state
# instead of trusting the retry's response alone.
server: python ../../tests/fixtures/ledger_server.py

setup:
  - call: reset_records

teardown:
  - call: reset_records

tests:
  - name: unprotected retry creates a duplicate
    call: create_record
    args: {name: invoice}
    fault: disconnect
    retry:
      attempts: 1
    expect:
      json_path: {name: invoice}
    verify:
      - call: count_records
        args: {name: invoice}
        expect:
          json_path: {records: 2, invocations: 2}

  - name: idempotent retry applies once
    call: create_record_idempotent
    args: {name: receipt, idempotency_key: receipt-001}
    fault: drop_response
    timeout_s: 0.5
    retry:
      attempts: 1
    expect:
      json_path: {name: receipt}
    verify:
      - call: count_records
        args: {name: receipt}
        expect:
          json_path: {records: 1, invocations: 2}
