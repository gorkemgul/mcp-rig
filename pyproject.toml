[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-rig"
version = "0.4.0"
description = "Deterministic, CI-friendly testing for MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "testing", "cli", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=2.2,<3",
  "httpx2>=2.10",
  "pyyaml>=6",
  "jsonschema>=4",
  "referencing>=0.28.4",
]

[project.urls]
Repository = "https://github.com/gorkemgul/mcp-rig"
Issues = "https://github.com/gorkemgul/mcp-rig/issues"

[project.scripts]
mcp-rig = "mcp_rig.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_rig"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/mcp_rig",
  "pyproject.toml",
  "README.md",
  "LICENSE",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "scripts/minimal_sdist.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
